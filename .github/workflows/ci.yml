name: CI

on:
  push:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install lint dependencies
        run: pip install -r requirements-dev.txt
      - name: Run ruff
        run: ruff check .

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          # From actionlint_1.7.12_checksums.txt (linux_amd64).
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" -o "${archive}"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o checksums.txt
          grep -F " ${archive}" checksums.txt | sha256sum -c -
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" actionlint
          sudo install actionlint /usr/local/bin/actionlint
      - name: Lint GitHub Actions workflows
        run: actionlint -color

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run API tests with coverage
        run: |
          cd apps/control-api
          PYTHONPATH=. pytest --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Run governance and forecasting tests
        run: pytest tests experiments/capacity-loop/tests experiments/gpu-placement/tests experiments/finops-recommendations/tests
      - name: OpenAPI contract freeze
        run: PYTHONPATH=apps/control-api python scripts/check_openapi_freeze.py
      - name: OpenAPI breaking-change check
        run: |
          git fetch --tags --force origin v1.0.0
          bash scripts/check_openapi_breaking.sh
      - name: Compile Python modules
        run: cd apps/control-api && python -m compileall app tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: apps/control-api/Dockerfile
          failure-threshold: warning
      - name: Build image and verify oras/cosign present
        run: |
          docker build -f apps/control-api/Dockerfile -t ai-control-plane:ci .
          docker run --rm --entrypoint /bin/sh ai-control-plane:ci -c 'oras version && cosign version'

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Terraform fmt (hetzner-vm)
        run: terraform -chdir=infra/terraform/hetzner-vm fmt -check -recursive
      - name: Terraform fmt (k3s-bootstrap)
        run: terraform -chdir=infra/terraform/k3s-bootstrap fmt -check -recursive
      - name: Terraform validate (hetzner-vm)
        run: |
          terraform -chdir=infra/terraform/hetzner-vm init -backend=false
          terraform -chdir=infra/terraform/hetzner-vm validate
      - name: Terraform validate (k3s-bootstrap)
        run: |
          terraform -chdir=infra/terraform/k3s-bootstrap init -backend=false
          terraform -chdir=infra/terraform/k3s-bootstrap validate

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Helm lint
        run: helm lint infra/helm/ai-control-plane
      - name: Helm template (defaults)
        run: helm template ai-control-plane infra/helm/ai-control-plane
      - name: Helm template (all optional resources enabled)
        run: |
          helm template ai-control-plane infra/helm/ai-control-plane \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.prometheusRule.enabled=true \
            --set ingress.enabled=true \
            --set networkPolicy.enabled=true
      - name: Helm template (production profile)
        run: |
          helm template ai-control-plane infra/helm/ai-control-plane \
            -f infra/helm/ai-control-plane/values-production.yaml
      - name: Helm template (postgres profile)
        run: |
          helm template ai-control-plane infra/helm/ai-control-plane \
            -f infra/helm/ai-control-plane/values-postgres.yaml
      - name: Helm template (single-node SQLite profile)
        run: |
          helm template ai-control-plane infra/helm/ai-control-plane \
            -f infra/helm/ai-control-plane/values-single-node.yaml
      - name: Helm rejects multi-replica SQLite
        run: |
          if helm template ai-control-plane infra/helm/ai-control-plane \
            --set autoscaling.enabled=true \
            --set autoscaling.minReplicas=2 \
            --set autoscaling.maxReplicas=4 \
            --set persistence.databaseUrl=sqlite:////var/lib/ai-control-plane/control-plane.db \
            >/tmp/bad-sqlite.yaml 2>/tmp/bad-sqlite.err; then
            echo "expected helm template to fail for multi-replica SQLite" >&2
            exit 1
          fi
          grep -qi 'SQLite persistence cannot be used' /tmp/bad-sqlite.err
      - name: Helm package smoke (artifact, not checkout path)
        run: bash scripts/helm_package_smoke.sh

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install conftest
        env:
          # Pin versions: GitHub /releases/latest is flaky under Actions API rate limits (404).
          CONFTEST_VERSION: "0.68.2"
          # From checksums.txt for conftest_0.68.2_Linux_x86_64.tar.gz.
          CONFTEST_SHA256: "e8144c6d6d2ae0260b869caa60c7c262a1f95ac63ec1e5d2fb19be452d606347"
        run: |
          set -euo pipefail
          archive="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/${archive}" -o "${archive}"
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/checksums.txt" -o checksums.txt
          grep -F " ${archive}" checksums.txt | sha256sum -c -
          echo "${CONFTEST_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" conftest
          sudo install conftest /usr/local/bin/conftest
      - name: Install OPA
        env:
          OPA_VERSION: "1.19.0"
          # From opa_linux_amd64_static.sha256 on the v1.19.0 release.
          OPA_SHA256: "1dd5c5591ff856f5e20a1d66bafae9511ddf3c5552ed3b5070c70b2b6580ee3f"
        run: |
          set -euo pipefail
          binary="opa_linux_amd64_static"
          curl -fsSL "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/${binary}" -o opa
          curl -fsSL "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/${binary}.sha256" -o opa.sha256
          echo "$(cut -d' ' -f1 opa.sha256)  opa" | sha256sum -c -
          echo "${OPA_SHA256}  opa" | sha256sum -c -
          chmod +x opa
          sudo install opa /usr/local/bin/opa
      - name: OPA unit tests
        run: opa test security/opa/tests security/opa/policies -v
      - name: Render manifests
        run: |
          helm template ai-control-plane infra/helm/ai-control-plane \
            --set metrics.serviceMonitor.enabled=true \
            --set ingress.enabled=true \
            --set networkPolicy.enabled=true > rendered-manifests.yaml
      - name: Conftest policy gate
        run: conftest test --policy security/opa/policies rendered-manifests.yaml

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: security/trivy/trivy.yaml
          format: table
          exit-code: "1"

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ai_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d ai_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run Postgres decision-store tests
        env:
          TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/ai_control
        run: |
          cd apps/control-api
          PYTHONPATH=. pytest tests/test_decision_store_postgres.py tests/test_schema_migrations.py -q

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run governance evaluate benchmark
        run: bash demo/e2e/benchmark_governance.sh

  e2e-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run compose e2e golden path
        run: bash demo/e2e/compose-e2e.sh

  e2e-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: ai-cp-e2e
      - name: Run kind e2e golden path
        env:
          SKIP_CLUSTER_CREATE: "1"
          CLUSTER_NAME: ai-cp-e2e
          KEEP_CLUSTER: "1"
        run: bash demo/e2e/kind-e2e.sh

  e2e-kind-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: ai-cp-pg-e2e
      - name: Run kind Postgres HA e2e
        env:
          SKIP_CLUSTER_CREATE: "1"
          CLUSTER_NAME: ai-cp-pg-e2e
          KEEP_CLUSTER: "1"
        run: bash demo/e2e/kind-postgres-e2e.sh
