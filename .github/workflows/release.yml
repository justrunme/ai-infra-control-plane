name: Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "apps/control-api/Dockerfile"
      - "apps/control-api/requirements.txt"
      - "apps/control-api/app/**"
      - "governance/**"
      - "fleet/**"
      - "finops/**"
      - "experiments/finops-recommendations/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_OCI: ghcr.io/justrunme/charts

jobs:
  lint-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          # From actionlint_1.7.12_checksums.txt (linux_amd64).
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" -o "${archive}"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o checksums.txt
          grep -F " ${archive}" checksums.txt | sha256sum -c -
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" actionlint
          sudo install actionlint /usr/local/bin/actionlint
      - name: Lint GitHub Actions workflows
        run: actionlint -color

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      # Create GitHub Releases and upload SBOM assets on tags.
      contents: write
      # Push container images and Helm charts to GHCR.
      packages: write
      # Keyless cosign signing via OIDC.
      id-token: write
      # Publish build provenance attestations.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize image coordinates
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Helm registry login
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" \
            -u "${{ github.actor }}" --password-stdin

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push control API image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/control-api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF#refs/tags/}"
          version="${tag_name#v}"
          notes_file="$(mktemp)"
          # Extract the Keep a Changelog section for this version as release notes.
          awk -v ver="${version}" '
            $0 ~ "^## \[" ver "\]" {found=1; print; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > "${notes_file}"
          if [[ ! -s "${notes_file}" ]]; then
            printf 'Release %s\n' "${tag_name}" > "${notes_file}"
          fi
          if gh release view "${tag_name}" >/dev/null 2>&1; then
            echo "Release ${tag_name} already exists"
          else
            gh release create "${tag_name}" \
              --verify-tag \
              --title "${tag_name}" \
              --notes-file "${notes_file}"
          fi

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: control-api-sbom.spdx.json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attach SBOM to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF#refs/tags/}"
          gh release upload "${tag_name}" sbom.spdx.json --clobber

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign container image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --registry-referrers-mode=legacy "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Verify signed image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Package, push, and sign Helm chart (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          pkg_dir="$(mktemp -d)"
          helm package infra/helm/ai-control-plane -d "${pkg_dir}"
          chart_pkg="$(ls "${pkg_dir}"/ai-control-plane-*.tgz)"
          push_out="$(helm push "${chart_pkg}" "oci://${{ env.CHART_OCI }}" 2>&1)"
          echo "${push_out}"
          chart_version="$(basename "${chart_pkg}" .tgz | sed 's/^ai-control-plane-//')"
          chart_ref="${{ env.CHART_OCI }}/ai-control-plane:${chart_version}"
          # Prefer digest from helm push output when present.
          digest="$(printf '%s\n' "${push_out}" | sed -n 's/.*sha256:\([a-f0-9]\{64\}\).*/sha256:\1/p' | tail -1)"
          if [[ -n "${digest}" ]]; then
            cosign sign --yes --registry-referrers-mode=legacy "${{ env.CHART_OCI }}/ai-control-plane@${digest}"
          else
            cosign sign --yes --registry-referrers-mode=legacy "${chart_ref}"
          fi
          echo "Signed chart ${chart_ref}"
