apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aicapabilitycontracts.ai.justrunme.dev
spec:
  group: ai.justrunme.dev
  names:
    kind: AICapabilityContract
    listKind: AICapabilityContractList
    plural: aicapabilitycontracts
    shortNames:
      - aicc
    singular: aicapabilitycontract
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["kind", "name", "contentDigest"]
              properties:
                kind:
                  type: string
                  enum: ["agent", "tool"]
                name:
                  type: string
                tenantId:
                  type: string
                  default: platform
                version:
                  type: string
                contentDigest:
                  type: string
                  description: sha256 digest of the capability payload
                source:
                  type: string
                  default: gitops
                capabilities:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                desiredStatus:
                  type: string
                  enum: ["draft", "active", "retired"]
                  default: active
            status:
              type: object
              properties:
                contractId:
                  type: string
                observedDigest:
                  type: string
                phase:
                  type: string
      additionalPrinterColumns:
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: Name
          type: string
          jsonPath: .spec.name
        - name: Digest
          type: string
          jsonPath: .spec.contentDigest
        - name: Desired
          type: string
          jsonPath: .spec.desiredStatus
