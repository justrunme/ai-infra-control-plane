apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aipolicybundles.ai.justrunme.dev
spec:
  group: ai.justrunme.dev
  names:
    kind: AIPolicyBundle
    listKind: AIPolicyBundleList
    plural: aipolicybundles
    singular: aipolicybundle
    shortNames:
      - apb
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [source]
              properties:
                source:
                  type: object
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [filesystem, oci]
                    path:
                      type: string
                    oci:
                      type: string
                      description: OCI reference (ghcr.io/org/ai-policies:tag)
                    digest:
                      type: string
                signature:
                  type: object
                  properties:
                    required:
                      type: boolean
                      default: true
                targets:
                  type: object
                  properties:
                    environments:
                      type: array
                      items:
                        type: string
                    teams:
                      type: array
                      items:
                        type: string
                rollout:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum: [automatic, approval]
                      default: approval
            status:
              type: object
              properties:
                observedDigest:
                  type: string
                bundleId:
                  type: string
                phase:
                  type: string
                  enum: [Pending, Validating, Active, Failed, RolledBack]
                lastValidation:
                  type: string
                message:
                  type: string
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Digest
          type: string
          jsonPath: .status.observedDigest
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
