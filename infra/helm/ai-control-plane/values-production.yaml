# Production HA profile: PostgreSQL authoritative store + multi-replica API.
# Override persistence.databaseUrl and oidc.* for your environment before install.
# For single-node SQLite demos use values-single-node.yaml instead.

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6

image:
  tag: "0.4.0"
  pullPolicy: IfNotPresent

persistence:
  enabled: true
  # Shared durable state lives in Postgres — no RWO SQLite PVC.
  size: ""
  existingClaim: ""
  databaseUrl: postgresql://ai_control:CHANGE_ME@postgres.databases.svc:5432/ai_control
  approvalTtlSeconds: 3600
  probeCacheTtlSeconds: 10
  httpTrustEnv: false

oidc:
  jwtVerify: true
  jwksUrl: https://keycloak.example.com/realms/ai-platform/protocol/openid-connect/certs
  jwtAudience: ai-control-plane
  jwtIssuer: https://keycloak.example.com/realms/ai-platform

audit:
  jsonlEnabled: true
  lokiEnabled: true
  lokiUrl: http://loki.monitoring.svc:3100

networkPolicy:
  enabled: true

metrics:
  serviceMonitor:
    enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1
