# Production HA profile: PostgreSQL authoritative store + multi-replica API.
# Provide DATABASE_URL via Secret (persistence.existingSecret). Override oidc.* for your IdP.
# For single-node SQLite demos use values-single-node.yaml instead.

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6

image:
  tag: "1.5.0"
  pullPolicy: IfNotPresent

persistence:
  enabled: true
  # Shared durable state lives in Postgres — no RWO SQLite PVC.
  size: ""
  existingClaim: ""
  # Do not put production DB credentials in values; mount from a Secret.
  existingSecret: ai-control-plane-database
  databaseUrlKey: DATABASE_URL
  databaseUrl: ""
  approvalTtlSeconds: 3600
  retentionDays: 90
  tenantIsolation: true
  probeCacheTtlSeconds: 10
  httpTrustEnv: false

oidc:
  jwtVerify: true
  jwksUrl: https://keycloak.example.com/realms/ai-platform/protocol/openid-connect/certs
  jwtAudience: ai-control-plane
  jwtIssuer: https://keycloak.example.com/realms/ai-platform
  approverGroups: "ai-approvers,secops"

audit:
  jsonlEnabled: true
  lokiEnabled: true
  lokiUrl: http://loki.monitoring.svc:3100

networkPolicy:
  enabled: true

metrics:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1
